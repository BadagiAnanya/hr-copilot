name: Evals

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "evals/**"
      - "data/policies/**"

jobs:
  evals:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: hrbot
          POSTGRES_PASSWORD: hrbot
          POSTGRES_DB: hrbot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hrbot"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      POSTGRES_URL: postgresql://hrbot:hrbot@localhost:5432/hrbot
      REDIS_URL: redis://localhost:6379/0
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Init schema + seed
        run: |
          psql "$POSTGRES_URL" -f docker/init.sql
          psql "$POSTGRES_URL" -f data/seed/employees.sql
      - name: Ingest
        run: python -m app.ingestion.run
      - name: Run evals
        run: python -m evals.run
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: evals/results/
